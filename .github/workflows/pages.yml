name: Deploy PHOENIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout PHOENIX
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare PHOENIX site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r frontend _site/frontend
          echo "===== DEPLOYMENT STRUCTURE ====="
          find _site -maxdepth 3 -type f | sort | head -100
          echo "===== CHECK LOGIN ====="
          test -f _site/frontend/login.html
          echo "login.html FOUND"

      - name: Upload PHOENIX Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site/frontend/index.html

      - name: Deploy PHOENIX
        id: deployment
        uses: actions/deploy-pages@v4
