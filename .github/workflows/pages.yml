name: Deploy PHOENIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout PHOENIX
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare PHOENIX
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r frontend/. _site/

      - name: Upload PHOENIX
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy PHOENIX
        id: deployment
        uses: actions/deploy-pages@v4
