<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PHOENIX | Sign In</title>

    <link
        rel="stylesheet"
        href="css/phoenix.css"
    
    >

    <style>
        /* =====================================================
           PHOENIX LOGIN
           ===================================================== */

        .login-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 32px 20px;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(56, 189, 248, 0.08),
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #070b12 0%,
                    #080e17 100%
                );
        }

        /*
         * Subtle SOC-style background grid.
         * Kept intentionally low contrast.
         */
        .login-page::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            opacity: 0.18;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;

            mask-image: linear-gradient(
                to bottom,
                black,
                transparent 80%
            );
        }

        .login-shell {
            width: min(440px, 100%);

            position: relative;
            z-index: 1;
        }

        /* =====================================================
           BRAND
           ===================================================== */

        .login-brand {
            text-align: center;

            margin-bottom: 28px;
        }

        .login-symbol {
            width: 56px;
            height: 56px;

            margin: 0 auto 16px;

            display: grid;
            place-items: center;

            border: 1px solid rgba(56, 189, 248, 0.38);

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    rgba(56, 189, 248, 0.14),
                    rgba(14, 22, 34, 0.95)
                );

            color: #7dd3fc;

            font-size: 25px;
            font-weight: 800;

            box-shadow:
                0 0 0 1px rgba(56, 189, 248, 0.04),
                0 12px 35px rgba(0, 0, 0, 0.25);
        }

        .login-brand strong {
            display: block;

            color: #f1f5f9;

            font-size: 23px;
            line-height: 1.2;

            font-weight: 750;

            letter-spacing: 0.12em;
        }

        .login-brand span {
            display: block;

            margin-top: 7px;

            color: #718096;

            font-size: 11px;
            line-height: 1.4;

            font-weight: 600;

            letter-spacing: 0.08em;

            text-transform: uppercase;
        }

        /* =====================================================
           LOGIN CARD
           ===================================================== */

        .login-card {
            overflow: hidden;

            border: 1px solid #1d2a3a;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    rgba(14, 22, 34, 0.98),
                    rgba(9, 15, 24, 0.99)
                );

            box-shadow:
                0 22px 70px rgba(0, 0, 0, 0.42),
                0 4px 20px rgba(0, 0, 0, 0.22);
        }

        /* =====================================================
           CARD HEADER
           ===================================================== */

        .login-head {
            padding: 22px 24px;

            border-bottom: 1px solid #1d2a3a;

            background: rgba(255, 255, 255, 0.012);
        }

        .login-head h1 {
            margin: 0;

            color: #e8eef7;

            font-size: 17px;
            line-height: 1.35;

            font-weight: 650;

            letter-spacing: -0.01em;
        }

        .login-head p {
            margin: 7px 0 0;

            color: #8190a3;

            font-size: 12px;
            line-height: 1.55;
        }

        /* =====================================================
           FORM BODY
           ===================================================== */

        .login-body {
            padding: 24px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 7px;

            color: #a8b5c7;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.055em;

            text-transform: uppercase;
        }

        .field input {
            width: 100%;

            height: 44px;

            box-sizing: border-box;

            border: 1px solid #26364a;

            border-radius: 7px;

            background: #0a111b;

            color: #e8eef7;

            padding: 0 13px;

            font-size: 13px;

            outline: none;

            transition:
                border-color 160ms ease,
                background 160ms ease,
                box-shadow 160ms ease;
        }

        .field input::placeholder {
            color: #536275;
        }

        .field input:hover {
            border-color: #34475e;
        }

        .field input:focus {
            background: #0b141f;

            border-color: rgba(56, 189, 248, 0.62);

            box-shadow:
                0 0 0 3px rgba(56, 189, 248, 0.08);
        }

        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        .login-button {
            width: 100%;

            height: 44px;

            margin-top: 3px;

            border: 1px solid rgba(56, 189, 248, 0.42);

            border-radius: 7px;

            background:
                linear-gradient(
                    180deg,
                    rgba(56, 189, 248, 0.17),
                    rgba(56, 189, 248, 0.10)
                );

            color: #bae6fd;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 0.01em;

            cursor: pointer;

            transition:
                background 160ms ease,
                border-color 160ms ease,
                transform 160ms ease,
                box-shadow 160ms ease;
        }

        .login-button:hover {
            background:
                linear-gradient(
                    180deg,
                    rgba(56, 189, 248, 0.23),
                    rgba(56, 189, 248, 0.14)
                );

            border-color: rgba(56, 189, 248, 0.65);

            box-shadow:
                0 6px 20px rgba(56, 189, 248, 0.08);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .login-button:disabled {
            opacity: 0.6;

            cursor: wait;

            box-shadow: none;
        }

        /* =====================================================
           SECURITY NOTICE
           ===================================================== */

        .login-security {
            display: flex;
            align-items: flex-start;

            gap: 9px;

            margin-top: 18px;

            padding: 11px 12px;

            border: 1px solid rgba(56, 189, 248, 0.12);

            border-radius: 7px;

            background: rgba(56, 189, 248, 0.025);
        }

        .login-security-icon {
            flex: 0 0 auto;

            color: #60a5fa;

            font-size: 13px;

            line-height: 1.5;
        }

        .login-security-text {
            color: #6f8094;

            font-size: 11px;

            line-height: 1.5;
        }

        /* =====================================================
           FOOTER
           ===================================================== */

        .login-footer {
            margin-top: 18px;

            text-align: center;

            color: #536275;

            font-size: 11px;

            line-height: 1.5;
        }

        .login-footer strong {
            color: #718096;

            font-weight: 650;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 520px) {

            .login-page {
                padding: 24px 15px;
            }

            .login-brand {
                margin-bottom: 22px;
            }

            .login-brand strong {
                font-size: 21px;
            }

            .login-card {
                border-radius: 11px;
            }

            .login-head {
                padding: 20px;
            }

            .login-body {
                padding: 20px;
            }

        }

        @media (max-height: 650px) {

            .login-page {
                align-items: flex-start;

                padding-top: 30px;
                padding-bottom: 30px;
            }

            .login-brand {
                margin-bottom: 18px;
            }

            .login-symbol {
                width: 46px;
                height: 46px;

                margin-bottom: 10px;

                font-size: 20px;
            }

        }
    </style>

</head>


<body>

<div class="login-page">

    <main class="login-shell">

        <!-- =================================================
             BRAND
             ================================================= -->

        <header class="login-brand">

            <div class="login-symbol" aria-hidden="true">
                P
            </div>

            <strong>PHOENIX</strong>

            <span>
                Enterprise Cyber Defense Platform
            </span>

        </header>


        <!-- =================================================
             LOGIN CARD
             ================================================= -->

        <section class="login-card">

            <div class="login-head">

                <h1>
                    Sign in to PHOENIX
                </h1>

                <p>
                    Authenticate to access security operations,
                    investigations and response workflows.
                </p>

            </div>


            <div class="login-body">

                <!--
                    IMPORTANT:
                    Keep the existing form ID and input IDs/names
                    used by your JavaScript.
                -->

                <form id="loginForm">

                    <div class="field">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >
                        Sign In
                    </button>

                </form>


                <div class="login-security">

                    <div
                        class="login-security-icon"
                        aria-hidden="true"
                    >
                        ●
                    </div>

                    <div class="login-security-text">
                        Authorized personnel only.
                        Authentication activity is recorded
                        in the PHOENIX security audit trail.
                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <footer class="login-footer">

            <strong>PHOENIX</strong>
            &nbsp;•&nbsp;
            Enterprise Security Operations

        </footer>

    </main>

<script src="js/api.js"></script>

<script>
    (() => {

        const form =
            document.getElementById("loginForm");

        const button =
            document.getElementById("loginButton");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");


        if (!form || !button) {
            console.error(
                "[PHOENIX] Login form initialization failed."
            );

            return;
        }


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const username =
                    usernameInput.value.trim();

                const password =
                    passwordInput.value;


                if (!username || !password) {
                    return;
                }


                const originalText =
                    button.textContent;


                button.disabled = true;

                button.textContent =
                    "Authenticating...";


                try {

                    await window.PhoenixAPI.login(
                        username,
                        password
                    );


                    button.textContent =
                        "Authentication successful";


                    /*
                     * Give the browser a moment to update
                     * the button before navigating.
                     */

                    window.location.href =
                        "./";


                } catch (error) {

                    console.error(
                        "[PHOENIX] Login failed:",
                        error
                    );


                    button.disabled = false;

                    button.textContent =
                        originalText;


                    showLoginError(
                        error?.message ||
                        "Authentication failed. Please try again."
                    );

                }

            }
        );


        function showLoginError(message) {

            let errorBox =
                document.getElementById(
                    "loginError"
                );


            if (!errorBox) {

                errorBox =
                    document.createElement("div");

                errorBox.id =
                    "loginError";

                errorBox.setAttribute(
                    "role",
                    "alert"
                );


                errorBox.style.marginTop =
                    "14px";

                errorBox.style.padding =
                    "10px 12px";

                errorBox.style.border =
                    "1px solid rgba(244, 63, 94, 0.30)";

                errorBox.style.borderRadius =
                    "7px";

                errorBox.style.background =
                    "rgba(244, 63, 94, 0.08)";

                errorBox.style.color =
                    "#fda4af";

                errorBox.style.fontSize =
                    "12px";

                errorBox.style.lineHeight =
                    "1.5";


                form.appendChild(
                    errorBox
                );

            }


            errorBox.textContent =
                message;

        }

    })();
</script>

</body>

</html>
